[pytest]
# Pytest configuration for APEX property-based tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Hypothesis settings
# Use a fixed seed for reproducibility in CI/CD
hypothesis_seed = 42

# Markers for categorizing tests
markers =
    property: Property-based tests using hypothesis
    unit: Unit tests for specific scenarios
    integration: Integration tests across components
    slow: Tests that take longer to run

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --hypothesis-show-statistics

# Asyncio configuration
asyncio_mode = auto

# Coverage options
[coverage:run]
source = .
omit =
    .venv/*
    tests/*
    scripts/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
