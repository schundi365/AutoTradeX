name: Deploy Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'push' || github.event.inputs.environment == 'staging'
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Run pre-deployment tests
        run: |
          pytest tests/smoke/ -v
      
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment script here
          # ./scripts/deploy.sh staging
        env:
          DEPLOY_ENV: staging
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
      
      - name: Run smoke tests on staging
        run: |
          sleep 30  # Wait for deployment
          pytest tests/smoke/ --env=staging -v
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
      
      - name: Notify deployment status
        if: always()
        run: |
          echo "Staging deployment completed with status: ${{ job.status }}"

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    if: github.event_name == 'push' || github.event.inputs.environment == 'production'
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Create deployment backup
        run: |
          echo "Creating backup of current production..."
          # ./scripts/backup.sh production
      
      - name: Deploy canary (10% traffic)
        run: |
          echo "Deploying canary to 10% of traffic..."
          # ./scripts/deploy.sh production --canary=10
        env:
          DEPLOY_ENV: production
          DEPLOY_KEY: ${{ secrets.PRODUCTION_DEPLOY_KEY }}
      
      - name: Monitor canary metrics
        run: |
          echo "Monitoring canary for 5 minutes..."
          sleep 300
          # ./scripts/monitor_canary.sh --duration=300 --error-threshold=1
        timeout-minutes: 10
      
      - name: Full production deployment
        if: success()
        run: |
          echo "Canary successful, deploying to 100% traffic..."
          # ./scripts/deploy.sh production --full
      
      - name: Rollback on failure
        if: failure()
        run: |
          echo "Canary failed, rolling back..."
          # ./scripts/rollback.sh production
      
      - name: Run smoke tests on production
        if: success()
        run: |
          pytest tests/smoke/ --env=production -v
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
      
      - name: Notify deployment status
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Production deployment ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
